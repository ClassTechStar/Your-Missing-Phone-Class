name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 全版本门禁与宣称值
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 结构/锚点/目录/版本串/lang/NUL/残留字（v1.8）
        run: python -m bookkit lint --all-versions

      - name: README 与 index.html 宣称值校验（章数/区块数/语言数/链接）
        run: python -m bookkit check --claims

      - name: index.html 卡片块与 manifest 一致性（AUTOGEN 漂移检测）
        if: always()
        run: python -m bookkit index --check

      - name: 翻译覆盖率报告
        if: always()
        run: python -m bookkit i18n --report coverage.md

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.md

  build:
    name: 源稿构建可复现性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 源稿 → HTML 与已发布成品等价性（全部 19 种语言逐章比对）
        run: |
          fail=0
          for f in v1.8/*.html; do
            L=$(basename "$f" .html)
            if ! python -m bookkit build --lang "$L" --verify | tee /tmp/verify.log | grep -q "结论：PASS"; then
              echo "!! $L 校验未通过："
              grep -E "区块 id|目录一致|可见文本|逐章结构|结构差异" /tmp/verify.log
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "全部语言 build --verify 通过"

      - name: 构建幂等（两次构建字节一致）
        run: |
          python -m bookkit build --out dist/a.html
          python -m bookkit build --out dist/b.html
          cmp dist/a.html dist/b.html

      - name: 源稿结构自检（book.json 与章文件一一对应）
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          for base in [Path('source')] + sorted(Path('source/translations').iterdir()):
              if not base.is_dir() or not (base / 'book.json').is_file():
                  continue
              book = json.loads((base / 'book.json').read_text(encoding='utf-8'))
              missing = [c['file'] for c in book['chapters'] if not (base / c['file']).is_file()]
              missing += [p['file'] for p in book['parts'] if not (base / p['file']).is_file()]
              ids = [c['id'] for c in book['chapters']]
              if missing:
                  raise SystemExit(f'源稿缺失（{base.name}）：' + str(missing[:5]))
              if len(ids) != len(set(ids)):
                  raise SystemExit(f'book.json 存在重复章节 id（{base.name}）')
              print(f'{base.name}: {len(ids)} chapters, {len(book["parts"])} parts')
          EOF

  audit:
    name: 全量质检与浏览器冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: HTML 全量审计（顺序/编号/排版产物/rtl）
        run: python scripts/html_audit.py

      - name: PDF 目录风格审计（latex/*/main.toc）
        run: |
          pip install pymupdf -q
          python scripts/verify_pdf_toc.py

      - name: 翻译源稿保真验证（18 语言逐章等价）
        run: python scripts/extract_translations.py

      - name: 题库与源稿同步（防止改了正文题库没跟着变）
        run: |
          python scripts/gen_quiz.py --out dist/quiz-check.json
          python - <<'EOF'
          import json, sys
          from pathlib import Path
          a = json.loads(Path('quiz/zh-CN.json').read_text(encoding='utf-8'))
          b = json.loads(Path('dist/quiz-check.json').read_text(encoding='utf-8'))
          if a != b:
              print('题库与源稿不同步，请运行 python scripts/gen_quiz.py 并提交')
              ai = {c['id']: c for c in a['chapters']}
              bi = {c['id']: c for c in b['chapters']}
              print('  仅题库有:', sorted(set(ai) - set(bi))[:5])
              print('  仅源稿有:', sorted(set(bi) - set(ai))[:5])
              diff = [k for k in ai if k in bi and ai[k] != bi[k]]
              print('  内容不同:', diff[:5])
              sys.exit(1)
          print(f"题库同步 OK：{len(a['chapters'])} 章，"
                f"{sum(len(c['questions']) for c in a['chapters'])} 题")
          EOF

      - name: 安装 Playwright
        run: pip install playwright -q && python -m playwright install chromium --with-deps

      - name: 浏览器冒烟（20 页 console 零报错 + 锚点解析 + h3 计数）
        run: python scripts/web_smoke.py

      - name: 题库与结构 schema 校验（quiz / book.json）
        if: always()
        run: python scripts/quiz_lint.py
