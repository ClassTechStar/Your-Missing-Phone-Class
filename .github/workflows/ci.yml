name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 全版本门禁与宣称值
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 单元测试（bookkit 核心模块边界用例）
        run: |
          pip install pytest -q
          python -m pytest tests/ -q

      - name: 结构/锚点/目录/版本串/lang/NUL/残留字（v1.8）
        run: python -m bookkit lint --all-versions

      - name: README 与 index.html 宣称值校验（章数/区块数/语言数/链接）
        run: python -m bookkit check --claims

      - name: 元数据单一真源核对（章数/篇数/字数/语言数跨文件一致）
        run: python scripts/consistency_lint.py

      - name: index.html 卡片块与 manifest 一致性（AUTOGEN 漂移检测）
        if: always()
        run: python -m bookkit index --check

      - name: 翻译覆盖率报告
        if: always()
        run: python -m bookkit i18n --report coverage.md

      - name: 译文标点门禁（ASCII 逗号/冒号后缺空格）
        run: python -m bookkit i18n --check-spacing --fail-on error

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.md

  build:
    name: 源稿构建可复现性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 源稿 → HTML 与已发布成品等价性（全部 19 种语言逐章比对）
        run: |
          fail=0
          for f in v1.8/*.html; do
            L=$(basename "$f" .html)
            if ! python -m bookkit build --lang "$L" --verify | tee /tmp/verify.log | grep -q "结论：PASS"; then
              echo "!! $L 校验未通过："
              grep -E "区块 id|目录一致|可见文本|逐章结构|结构差异" /tmp/verify.log
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "全部语言 build --verify 通过"

      - name: v1.9 源稿回写等价性（source/v1.9 ↔ v1.9/zh-CN.html，直接改 HTML 的提交一律阻断）
        run: |
          if ! python -m bookkit build --book source/v1.9/book.json --verify | tee /tmp/verify19.log | grep -q "结论：PASS"; then
            echo "!! v1.9 源稿与成品不同步（改了 v1.9/zh-CN.html 请回写 source/v1.9，或改了 source/v1.9 请重建成品）："
            grep -E "区块 id|目录一致|可见文本|逐章结构|结构差异" /tmp/verify19.log
            exit 1
          fi

      - name: 分章化构建（19 语章节页 + sitemap/JSON-LD，页级预算 300KB/5000 标签硬门禁）
        run: python scripts/build_all_sites.py --strict-budget

      - name: 站点基建 lint（robots/sitemap 覆盖/OG 唯一/prefetch/hreflang/勘误公示/死链）
        run: python scripts/site_lint.py

      - name: 构建幂等（两次构建字节一致）
        run: |
          python -m bookkit build --out dist/a.html
          python -m bookkit build --out dist/b.html
          cmp dist/a.html dist/b.html

      - name: 源稿结构自检（book.json 与章文件一一对应）
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          for base in [Path('source'), Path('source/v1.9')] + sorted(Path('source/translations').iterdir()):
              if not base.is_dir() or not (base / 'book.json').is_file():
                  continue
              book = json.loads((base / 'book.json').read_text(encoding='utf-8'))
              missing = [c['file'] for c in book['chapters'] if not (base / c['file']).is_file()]
              missing += [p['file'] for p in book['parts'] if not (base / p['file']).is_file()]
              ids = [c['id'] for c in book['chapters']]
              if missing:
                  raise SystemExit(f'源稿缺失（{base.name}）：' + str(missing[:5]))
              if len(ids) != len(set(ids)):
                  raise SystemExit(f'book.json 存在重复章节 id（{base.name}）')
              print(f'{base.name}: {len(ids)} chapters, {len(book["parts"])} parts')
          EOF

  audit:
    name: 全量质检与浏览器冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: HTML 全量审计（顺序/编号/排版产物/rtl）
        run: python scripts/html_audit.py

      - name: PDF 目录风格审计（latex/*/main.toc）
        run: |
          pip install pymupdf -q
          python scripts/verify_pdf_toc.py

      - name: 翻译源稿保真验证（18 语言逐章等价）
        run: python scripts/extract_translations.py

      - name: 题库与源稿同步（防止改了正文题库没跟着变）
        run: |
          python scripts/gen_quiz.py --out dist/quiz-check.json
          python scripts/gen_quiz.py --version v1.8 --lang ja --out dist/quiz-check-ja.json
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          def check(name, path, regen, hint):
              a = json.loads(Path(path).read_text(encoding='utf-8'))
              b = json.loads(Path(regen).read_text(encoding='utf-8'))
              if a != b:
                  print(f'{name} 与源稿不同步，请运行 {hint} 并提交')
                  ai = {c['id']: c for c in a['chapters']}
                  bi = {c['id']: c for c in b['chapters']}
                  print('  仅题库有:', sorted(set(ai) - set(bi))[:5])
                  print('  仅源稿有:', sorted(set(bi) - set(ai))[:5])
                  diff = [k for k in ai if k in bi and ai[k] != bi[k]]
                  print('  内容不同:', diff[:5])
                  sys.exit(1)
              print(f'{name} 同步 OK：{len(a["chapters"])} 章，'
                    f'{sum(len(c["questions"]) for c in a["chapters"])} 题'
                    f'（对齐 {a.get("bookVersion")}）')

          check('zh-CN 题库', 'quiz/zh-CN.json', 'dist/quiz-check.json',
                'python scripts/gen_quiz.py')
          check('ja 题库', 'quiz/ja.json', 'dist/quiz-check-ja.json',
                'python scripts/gen_quiz.py --version v1.8 --lang ja --out quiz/ja.json')
          EOF

      - name: 安装 Playwright
        run: pip install playwright -q && python -m playwright install chromium --with-deps

      - name: 构建分章页（中文 + en/ar/ja 供浏览器冒烟覆盖）
        run: python scripts/build_all_sites.py --langs zh-CN en ar ja --strict-budget

      - name: 浏览器冒烟（35 页 console 零报错 + 锚点解析 + h3 计数）
        run: python scripts/web_smoke.py

      - name: 题库与结构 schema 校验（quiz / book.json）
        if: always()
        run: python scripts/quiz_lint.py
