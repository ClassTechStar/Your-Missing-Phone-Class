name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 全版本门禁与宣称值
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 结构/锚点/目录/版本串/lang/NUL/残留字（v1.8）
        run: python -m bookkit lint --all-versions

      - name: README 与 index.html 宣称值校验（章数/区块数/语言数/链接）
        run: python -m bookkit check --claims

      - name: index.html 卡片块与 manifest 一致性（AUTOGEN 漂移检测）
        if: always()
        run: python -m bookkit index --check

      - name: 翻译覆盖率报告
        if: always()
        run: python -m bookkit i18n --report coverage.md

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.md

  build:
    name: 源稿构建可复现性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 源稿 → HTML 与已发布成品等价性（逐章比对）
        run: python -m bookkit build --verify

      - name: 构建幂等（两次构建字节一致）
        run: |
          python -m bookkit build --out dist/a.html
          python -m bookkit build --out dist/b.html
          cmp dist/a.html dist/b.html

      - name: 源稿结构自检（book.json 与章文件一一对应）
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          book = json.loads(Path('source/book.json').read_text(encoding='utf-8'))
          missing = [c['file'] for c in book['chapters'] if not (Path('source') / c['file']).is_file()]
          missing += [p['file'] for p in book['parts'] if not (Path('source') / p['file']).is_file()]
          ids = [c['id'] for c in book['chapters']]
          if missing:
              raise SystemExit('源稿缺失：' + str(missing))
          if len(ids) != len(set(ids)):
              raise SystemExit('book.json 存在重复章节 id')
          print('source OK:', len(ids), 'chapters,', len(book['parts']), 'parts')
          EOF

  audit:
    name: 全量质检与浏览器冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: HTML 全量审计（顺序/编号/排版产物/rtl）
        run: python scripts/html_audit.py

      - name: PDF 目录风格审计（latex/*/main.toc）
        run: |
          pip install pymupdf -q
          python scripts/verify_pdf_toc.py

      - name: 翻译源稿保真验证（18 语言逐章等价）
        run: python scripts/extract_translations.py

      - name: 安装 Playwright
        run: pip install playwright -q && python -m playwright install chromium --with-deps

      - name: 浏览器冒烟（20 页 console 零报错 + 锚点解析 + h3 计数）
        run: python scripts/web_smoke.py
